{% extends 'base.html' %}

{% block title %}Leave {{ group.name }} - Splitgood{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Leave Group</h1>
</div>

<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="group-icon" style="background-color: {{ group.group_color }}; width: 64px; height: 64px; font-size: 1.25rem; margin: 0 auto 1rem;">
                {{ group.name|slice:":2"|upper }}
            </div>
            <h2 style="margin-bottom: 0.5rem;">Leave "{{ group.name }}"?</h2>
            <p style="color: var(--text-secondary);">You will no longer have access to this group's expenses and balances.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="flex gap-3" style="justify-content: center;">
                <button type="submit" class="btn btn-danger" data-testid="button-confirm-leave">
                    Leave Group
                </button>
                <a href="{% url 'group_detail' group.id %}" class="btn btn-secondary" data-testid="button-cancel-leave">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
