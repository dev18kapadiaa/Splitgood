<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - Splitgood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v12M6 12h12"/>
                </svg>
                <h1>Verify your phone</h1>
                <p>Enter the 6-digit code sent to {{ phone }}</p>
            </div>

            {% if messages %}
            <div class="messages-container mb-4">
                {% for message in messages %}
                <div class="message message-{{ message.tags }}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_otp_code" class="form-label">Verification Code</label>
                    {{ form.otp_code }}
                    {% if form.otp_code.errors %}
                    <div class="form-error">{{ form.otp_code.errors.0 }}</div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full" data-testid="button-verify-oauth">
                    Verify & Complete Signup
                </button>
            </form>

            <div class="auth-footer">
                <a href="{% url 'oauth_phone_capture' %}" data-testid="link-back-oauth-phone">Change phone number</a>
            </div>
        </div>
    </div>
</body>
</html>
